# ===== Configuracao dos testes automaticos (perfil "teste") =====
# Os testes usam um banco SEPARADO no seu PC: "contas_teste". Nunca o Supabase.
# Os valores abaixo valem por cima do application.properties principal.
# Precisa da variavel DB_PASSWORD_TESTE com a senha do PostgreSQL do seu PC.
spring.datasource.url=jdbc:postgresql://localhost:5432/contas_teste
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD_TESTE}

# Chaves de mentira, so para os testes
app.jwt.segredo=chave-de-teste-com-mais-de-32-caracteres-123456
app.interno.chave=chave-interna-de-teste-com-mais-de-32-caracteres
app.google.client-id=

# Nada sai de verdade nos testes
app.email.brevo-api-key=
app.email.remetente=
app.site.url=http://localhost:3000
app.planos.liberar-tudo-para-teste=false
app.curriculos.habilitado=false
app.termos.versao-atual=2026-10
app.limpeza.primeira-em=PT24H
