spring.application.name=contas

# ===== Conexao com o banco =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
# Quantas conexoes a API abre com o banco. O plano gratis do Supabase tem limite, entao fica baixo.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:5}

# ===== Quem cria as tabelas e o Flyway =====
spring.jpa.hibernate.ddl-auto=none
# Se o banco ja tiver algo criado pelo Supabase, o Flyway marca a "versao 0" e roda todas as migracoes (V1 em diante)
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.open-in-view=false

# ===== Porta da API =====
# A hospedagem (ex.: Render) informa a porta pela variavel PORT; no seu PC continua 8080
server.port=${PORT:8080}

# ===== Login (JWT) =====
# Chave secreta que assina os tokens. Minimo de 32 caracteres. Vem do "cofre" do Windows.
app.jwt.segredo=${JWT_SECRET}
app.jwt.minutos-acesso=15
app.jwt.dias-refresh=30

# ===== Entrar com Google (fica desligado enquanto GOOGLE_CLIENT_ID estiver vazio) =====
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ===== Sites que podem chamar a API pelo navegador (separados por virgula) =====
app.cors.origens=${CORS_ORIGENS:http://localhost:3000}

# ===== Curriculos (so PDF) =====
# Pasta onde os arquivos ficam guardados (ignorada pelo Git)
app.curriculos.pasta=${CURRICULOS_PASTA:dados/curriculos}
app.curriculos.tamanho-maximo-mb=5
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ===== Termos de uso =====
# Versao atual dos termos. Quando os termos mudarem, troque aqui (e todos aceitam de novo).
app.termos.versao-atual=${TERMOS_VERSAO:2026-10}

# ===== Rotas internas (coletor e match) =====
# Chave secreta que o coletor manda no cabecalho X-Chave-Interna (minimo 32 caracteres).
# Vazia = rotas internas desligadas.
app.interno.chave=${INTERNO_CHAVE:}

# ===== Planos =====
# Para TESTAR o "o que falta" sem pagamento: PLANOS_LIBERAR_TUDO=true trata todos como plano pago.
# Nunca ligue isso no servidor de verdade.
app.planos.liberar-tudo-para-teste=${PLANOS_LIBERAR_TUDO:false}
