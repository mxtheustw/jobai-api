spring.application.name=contas

# ===== Conexao com o banco =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/contas}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===== Quem cria as tabelas e o Flyway =====
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Porta da API =====
server.port=8080

# ===== Login (JWT) =====
# Chave secreta que assina os tokens. Minimo de 32 caracteres. Vem do "cofre" do Windows.
app.jwt.segredo=${JWT_SECRET}
app.jwt.minutos-acesso=15
app.jwt.dias-refresh=30

# ===== Entrar com Google (fica desligado enquanto GOOGLE_CLIENT_ID estiver vazio) =====
app.google.client-id=${GOOGLE_CLIENT_ID:}

# ===== Sites que podem chamar a API pelo navegador (separados por virgula) =====
app.cors.origens=${CORS_ORIGENS:http://localhost:3000}
